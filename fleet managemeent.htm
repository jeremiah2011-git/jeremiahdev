<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FleetFlow — Fleet Management System</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
      --green-bg: #dcfce7;
      --green-text: #166534;
      --amber-bg: #fef3c7;
      --amber-text: #92400e;
      --red-bg: #fee2e2;
      --red-text: #991b1b;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1150px; margin: 0 auto; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
    }
    header h1 { margin: 0; font-size: 1.5rem; }
    .btn {
      background: var(--primary); color: #fff; border: none; padding: 9px 14px;
      border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-sm { padding: 5px 10px; font-size: 0.8rem; }
    .btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { background: #f8fafc; }

    /* KPI Summary Cards */
    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px; margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--card); padding: 16px; border-radius: 8px;
      border: 1px solid var(--border);
    }
    .kpi-card span { color: var(--muted); font-size: 0.85rem; }
    .kpi-card h2 { margin: 6px 0 0; font-size: 1.6rem; }

    /* Forms & Layout */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    @media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } }

    .panel {
      background: var(--card); padding: 18px; border-radius: 8px;
      border: 1px solid var(--border); margin-bottom: 20px;
    }
    .panel h3 { margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    input, select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.9rem;
    }

    /* Tables & Badges */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; background: #f8fafc; }

    .badge {
      padding: 3px 8px; border-radius: 999px; font-size: 0.78rem; font-weight: 600;
      display: inline-block;
    }
    .Available, .Completed { background: var(--green-bg); color: var(--green-text); }
    .OnTrip, .InProgress { background: var(--amber-bg); color: var(--amber-text); }
    .Maintenance { background: var(--red-bg); color: var(--red-text); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>FleetFlow Management</h1>
        <small style="color: var(--muted);">Vehicle Inventory, Dispatch & Trip Tracking</small>
      </div>
      <button class="btn btn-outline" onclick="resetDemoData()">Reset Demo Data</button>
    </header>

    <!-- KPI Cards -->
    <div class="kpi-grid" id="kpiContainer"></div>

    <!-- Action Forms -->
    <div class="grid-2">
      <!-- Add Vehicle Form -->
      <div class="panel">
        <h3>+ Register New Vehicle</h3>
        <form id="vehicleForm">
          <div class="form-row">
            <input type="text" id="plateInput" placeholder="Plate No. (e.g. AA-3-48210)" required />
            <input type="text" id="modelInput" placeholder="Model (e.g. Isuzu NPR)" required />
          </div>
          <div class="form-row">
            <input type="number" id="odometerInput" placeholder="Odometer (km)" min="0" required />
            <input type="number" id="fuelInput" placeholder="Fuel Level (%)" min="0" max="100" value="100" required />
          </div>
          <button type="submit" class="btn">Add Vehicle</button>
        </form>
      </div>

      <!-- Dispatch Trip Form -->
      <div class="panel">
        <h3>+ Dispatch Vehicle on Trip</h3>
        <form id="dispatchForm">
          <div class="form-row">
            <select id="dispatchVehicleSelect" required></select>
            <input type="text" id="driverInput" placeholder="Driver Full Name" required />
          </div>
          <div class="form-row">
            <input type="text" id="routeInput" placeholder="Route (e.g. Debre Markos → Addis Ababa)" required />
            <input type="number" id="distanceInput" placeholder="Est. Distance (km)" min="1" required />
          </div>
          <button type="submit" class="btn">Dispatch Trip</button>
        </form>
      </div>
    </div>

    <!-- Fleet Inventory Table -->
    <div class="panel">
      <h3>Fleet Vehicles</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Plate Number</th>
              <th>Model</th>
              <th>Status</th>
              <th>Odometer</th>
              <th>Fuel</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="vehicleTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Active & Past Trips Table -->
    <div class="panel">
      <h3>Dispatch & Trip Logs</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Vehicle</th>
              <th>Driver</th>
              <th>Route</th>
              <th>Distance</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tripTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'fleetflow_state_v1';

    // Default seed data for immediate testing
    const defaultState = {
      vehicles: [
        { id: 'v1', plate: 'AA-3-19204', model: 'Toyota Hilux Pickup', status: 'Available', odometer: 45200, fuel: 85 },
        { id: 'v2', plate: 'AM-2-77410', model: 'Isuzu FSR Cargo', status: 'On Trip', odometer: 112400, fuel: 60 },
        { id: 'v3', plate: 'AA-3-55019', model: 'Toyota HiAce Van', status: 'Maintenance', odometer: 89300, fuel: 40 }
      ],
      trips: [
        { id: 't1', vehicleId: 'v2', plate: 'AM-2-77410', driver: 'Dawit Bekele', route: 'Debre Markos → Bahir Dar', distance: 265, status: 'In Progress' }
      ]
    };

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || structuredClone(defaultState);

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    }

    function resetDemoData() {
      state = structuredClone(defaultState);
      saveState();
    }

    // Add a new vehicle
    document.getElementById('vehicleForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const plate = document.getElementById('plateInput').value.trim().toUpperCase();
      const model = document.getElementById('modelInput').value.trim();
      const odometer = Number(document.getElementById('odometerInput').value);
      const fuel = Number(document.getElementById('fuelInput').value);

      // Edge case: prevent duplicate plate numbers
      if (state.vehicles.some(v => v.plate === plate)) {
        alert('A vehicle with this plate number already exists.');
        return;
      }

      state.vehicles.push({
        id: 'v_' + Date.now(),
        plate,
        model,
        status: 'Available',
        odometer,
        fuel
      });

      e.target.reset();
      saveState();
    });

    // Dispatch a trip
    document.getElementById('dispatchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const vehicleId = document.getElementById('dispatchVehicleSelect').value;
      const driver = document.getElementById('driverInput').value.trim();
      const route = document.getElementById('routeInput').value.trim();
      const distance = Number(document.getElementById('distanceInput').value);

      const vehicle = state.vehicles.find(v => v.id === vehicleId);
      if (!vehicle || vehicle.status !== 'Available') {
        alert('Please select an available vehicle.');
        return;
      }

      // Update vehicle status and log trip
      vehicle.status = 'On Trip';
      state.trips.unshift({
        id: 't_' + Date.now(),
        vehicleId: vehicle.id,
        plate: vehicle.plate,
        driver,
        route,
        distance,
        status: 'In Progress'
      });

      e.target.reset();
      saveState();
    });

    // Toggle vehicle between Available and Maintenance
    function toggleMaintenance(vehicleId) {
      const vehicle = state.vehicles.find(v => v.id === vehicleId);
      if (!vehicle || vehicle.status === 'On Trip') return;
      vehicle.status = vehicle.status === 'Maintenance' ? 'Available' : 'Maintenance';
      saveState();
    }

    // Complete an active trip
    function completeTrip(tripId) {
      const trip = state.trips.find(t => t.id === tripId);
      if (!trip || trip.status === 'Completed') return;

      trip.status = 'Completed';
      const vehicle = state.vehicles.find(v => v.id === trip.vehicleId);
      if (vehicle) {
        vehicle.status = 'Available';
        vehicle.odometer += trip.distance;
        // Rough fuel estimate: ~1% per 8 km, floored at 5%
        vehicle.fuel = Math.max(5, vehicle.fuel - Math.round(trip.distance / 8));
      }
      saveState();
    }

    // Render entire UI
    function render() {
      // 1. Render KPIs
      const total = state.vehicles.length;
      const available = state.vehicles.filter(v => v.status === 'Available').length;
      const onTrip = state.vehicles.filter(v => v.status === 'On Trip').length;
      const maintenance = state.vehicles.filter(v => v.status === 'Maintenance').length;

      document.getElementById('kpiContainer').innerHTML = `
        <div class="kpi-card"><span>Total Fleet</span><h2>${total}</h2></div>
        <div class="kpi-card"><span>Available</span><h2 style="color:#166534">${available}</h2></div>
        <div class="kpi-card"><span>On Trip</span><h2 style="color:#92400e">${onTrip}</h2></div>
        <div class="kpi-card"><span>In Maintenance</span><h2 style="color:#991b1b">${maintenance}</h2></div>
      `;

      // 2. Populate Available Vehicles Dropdown
      const select = document.getElementById('dispatchVehicleSelect');
      const availableVehicles = state.vehicles.filter(v => v.status === 'Available');
      select.innerHTML = availableVehicles.length
        ? availableVehicles.map(v => `<option value="${v.id}">${v.plate} — ${v.model}</option>`).join('')
        : `<option value="">No vehicles available</option>`;

      // 3. Render Vehicles Table
      document.getElementById('vehicleTableBody').innerHTML = state.vehicles.map(v => {
        const badgeClass = v.status.replace(/\s+/g, '');
        const actionBtn = v.status === 'On Trip'
          ? `<span style="color:var(--muted); font-size:0.8rem;">Locked (On Trip)</span>`
          : `<button class="btn btn-sm btn-outline" onclick="toggleMaintenance('${v.id}')">
              ${v.status === 'Maintenance' ? 'Mark Ready' : 'Send to Service'}
             </button>`;

        return `
          <tr>
            <td><strong>${v.plate}</strong></td>
            <td>${v.model}</td>
            <td><span class="badge ${badgeClass}">${v.status}</span></td>
            <td>${v.odometer.toLocaleString()} km</td>
            <td>${v.fuel}%</td>
            <td>${actionBtn}</td>
          </tr>
        `;
      }).join('');

      // 4. Render Trips Table
      document.getElementById('tripTableBody').innerHTML = state.trips.map(t => {
        const badgeClass = t.status.replace(/\s+/g, '');
        const actionBtn = t.status === 'In Progress'
          ? `<button class="btn btn-sm" onclick="completeTrip('${t.id}')">Complete Trip</button>`
          : `<span style="color:var(--muted); font-size:0.8rem;">Closed</span>`;

        return `
          <tr>
            <td><strong>${t.plate}</strong></td>
            <td>${t.driver}</td>
            <td>${t.route}</td>
            <td>${t.distance} km</td>
            <td><span class="badge ${badgeClass}">${t.status}</span></td>
            <td>${actionBtn}</td>
          </tr>
        `;
      }).join('');
    }

    render();
  </script>
</body>
</html>
